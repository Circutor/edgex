default:
  tags:
    - linux
    - docker

before_script:
    - echo "List files:" && ls -l
    - echo "User:" && whoami
    - echo "IDs:" && id
    - echo "Hostname:" && hostname
    - echo "Current directory:" && pwd
    - echo "Go version:" && go version

stages:
    - lint
    - test
    - build
    - deploy

lint:
    stage: lint
    needs: []
    image: "golangci/golangci-lint:v1.44-alpine"
    script:
        - echo "Linter"
        - golangci-lint version
        - golangci-lint linters
        - golangci-lint run

test:
    stage: test
    needs: []
    image: "golang:1.17"
    script:
        - echo "Testing"
        - make test

build:
    stage: build
    except:
        - master
    needs: []
    image: 'circutor/golang:1.17'
    script:
        - echo "Building"
        - make arm

deploy:
    stage: deploy
    only:
        - master
    needs: []
    image: 'circutor/golang:1.17'
    script:
        - echo "Building to deploy"
        - make arm
        - mv cmd/edgex/edgex .
    artifacts:
        paths:
          - edgex
          - VERSION
